# ============================================================================
# Neon Pages — PRODUCTION stack
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Uses multi-stage Dockerfiles, pre-built images (backend/frontend), named
# volumes, health checks, and an optional Certbot service for HTTPS.
# ============================================================================

name: neonpages-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neonpages}
      POSTGRES_USER: ${POSTGRES_USER:-neonpages}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-db-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - neon-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-neonpages} -d ${POSTGRES_DB:-neonpages}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: neonpages/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-neonpages}:${POSTGRES_PASSWORD:-change-me-strong-db-password}@db:5432/${POSTGRES_DB:-neonpages}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN:?DOMAIN must be set}}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      QR_STORAGE_DIR: ${QR_STORAGE_DIR:-uploads/qr}
      PUBLIC_BASE_URL: https://${DOMAIN}
      RATE_LIMIT_TTL_SECONDS: ${RATE_LIMIT_TTL_SECONDS:-60}
      RATE_LIMIT_MAX_LOGIN_ATTEMPTS: ${RATE_LIMIT_MAX_LOGIN_ATTEMPTS:-5}
      ACCOUNT_LOCK_THRESHOLD: ${ACCOUNT_LOCK_THRESHOLD:-5}
      ACCOUNT_LOCK_MINUTES: ${ACCOUNT_LOCK_MINUTES:-15}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-User@12345}
    volumes:
      - qr-files:/app/uploads
    networks:
      - neon-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: neonpages/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      API_INTERNAL_URL: http://backend:3000/api/v1
    networks:
      - neon-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001 >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${NGINX_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/conf.d/prod-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - dhparam:/etc/nginx/dhparam:ro
    networks:
      - neon-net
    depends_on:
      - frontend
      - backend

  # One-shot Certbot container to obtain/renew Let's Encrypt certs.
  # The production HTTPS conf is only mounted once ./certbot/conf exists.
  certbot:
    image: certbot/certbot
    profiles: ['tls']
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  pgdata:
  qr-files:
  dhparam:

networks:
  neon-net:
    driver: bridge