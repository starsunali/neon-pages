# ============================================================================
# Neon Pages — DEFAULT Docker Compose stack
#
#   docker compose up -d --build
#
# Spins up: PostgreSQL 16 · NestJS API · Next.js frontend · Nginx reverse proxy
# Health checks + named volumes + isolated network included.
# ============================================================================

name: neonpages

services:
  # ----------------------------------------------------------
  # Database
  # ----------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neonpages}
      POSTGRES_USER: ${POSTGRES_USER:-neonpages}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-db-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - neon-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-neonpages} -d ${POSTGRES_DB:-neonpages}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ----------------------------------------------------------
  # Backend (NestJS API)
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-neonpages}:${POSTGRES_PASSWORD:-change-me-strong-db-password}@db:5432/${POSTGRES_DB:-neonpages}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      QR_STORAGE_DIR: ${QR_STORAGE_DIR:-uploads/qr}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      RATE_LIMIT_TTL_SECONDS: ${RATE_LIMIT_TTL_SECONDS:-60}
      RATE_LIMIT_MAX_LOGIN_ATTEMPTS: ${RATE_LIMIT_MAX_LOGIN_ATTEMPTS:-5}
      ACCOUNT_LOCK_THRESHOLD: ${ACCOUNT_LOCK_THRESHOLD:-5}
      ACCOUNT_LOCK_MINUTES: ${ACCOUNT_LOCK_MINUTES:-15}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-User@12345}
    volumes:
      - qr-files:/app/uploads
    networks:
      - neon-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # Frontend (Next.js)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
    networks:
      - neon-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001 >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------
  # Nginx reverse proxy (single entry point on port 80)
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${NGINX_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - dhparam:/etc/nginx/dhparam:ro
    networks:
      - neon-net
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  qr-files:
  dhparam:

networks:
  neon-net:
    driver: bridge
