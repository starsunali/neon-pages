# ============================================================================
# Neon Pages — default HTTP reverse proxy (development / first deploy)
#
# Routing:
#   /api          → backend (NestJS)  :3000
#   /uploads      → backend QR static files :3000
#   /p/... and all other paths → frontend (Next.js) :3001
# Swagger docs live at /api/docs
# ============================================================================

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;

# ---- Backend upstream ----
upstream backend_upstream {
    server backend:3000;
}

# ---- Frontend upstream ----
upstream frontend_upstream {
    server frontend:3001;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;

    # ---- API ----
    location /api/ {
        limit_req zone=general_limit burst=120 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- QR file downloads (authenticated, served by API) ----
    location ~ ^/api/v1/files/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- Frontend (Next.js) ----
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}